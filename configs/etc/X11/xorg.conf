Section "ServerFlags"
    Option                 "OffTime" "1"
EndSection

Section "Monitor"
    Identifier             "Monitor0"
    DisplaySize            151 67    # S20 Ultra's 6.9" display dimensions
EndSection

Section "Device"
    Identifier            "Mali-G77"
    Driver                "mali"      # Specific for Mali GPU
    Option                "fbdev"     "/dev/fb0"
    Option                "DRI"       "3"        # Enable DRI3 for better performance
    Option                "ShadowFB"  "true"     # Enable shadow framebuffer
    Option                "MaliDRI2"  "true"     # Mali-specific DRI configuration
    Option                "UseGPU"    "true"     # Ensure GPU acceleration is enabled
EndSection

Section "Screen"
    Identifier            "Screen0"
    Device               "Mali-G77"
    Monitor              "Monitor0"
    DefaultDepth         24
    SubSection          "Display"
        Depth           24
        Virtual        3200 1440    # S20 Ultra's maximum resolution
        # Uncomment below line for power-saving mode
        #Virtual       2400 1080    # Lower resolution option
    EndSubSection
EndSection

# Optional: Add DRI configuration
Section "DRI"
    Mode 0666
EndSection

# Optional: Add module loading
Section "Module"
    Load    "dri2"
    Load    "dri3"
    Load    "glamoregl"    # For better 2D acceleration
EndSection